name: Game news bot

on:
  schedule:
    - cron: "*/30 * * * *"   # кожні 30 хвилин (час UTC)
  workflow_dispatch:          # кнопка ручного запуску у вкладці Actions

permissions:
  contents: write             # щоб зберігати seen.json назад у репозиторій

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MIN_SCORE_ARTICLE: ${{ vars.MIN_SCORE_ARTICLE }}
          MIN_SCORE_TWEET: ${{ vars.MIN_SCORE_TWEET }}
          MIN_SCORE_STEAM: ${{ vars.MIN_SCORE_STEAM }}
          MIN_SCORE_DISCORD: ${{ vars.MIN_SCORE_DISCORD }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json state.json
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase --autostash || true
          git push

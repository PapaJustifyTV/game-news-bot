name: Game news bot

on:
  schedule:
    - cron: "7,37 * * * *"    # двічі на годину, о :07 і :37 (не о :00 — тоді GitHub перевантажений)
  workflow_dispatch:          # кнопка ручного запуску у вкладці Actions

permissions:
  contents: read
  actions: write              # щоб прибирати старі копії пам'яті бота

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Пам'ять бота (що вже опубліковано) живе в кеші GitHub, а не в репозиторії:
      # так репозиторій не розростається і не з'являються зайві коміти.
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Run bot
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MIN_SCORE_ARTICLE: ${{ vars.MIN_SCORE_ARTICLE }}
          MIN_SCORE_TWEET: ${{ vars.MIN_SCORE_TWEET }}
          MIN_SCORE_STEAM: ${{ vars.MIN_SCORE_STEAM }}
          MIN_SCORE_DISCORD: ${{ vars.MIN_SCORE_DISCORD }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MAX_LLM_CALLS: ${{ vars.MAX_LLM_CALLS }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
        run: python bot.py

      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            state.json
          key: news-state-${{ github.run_id }}

      - name: Clean old memory copies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # залишаємо 5 найсвіжіших копій пам'яті, решту видаляємо
          gh cache list --key news-state- --sort created_at --order desc --limit 100 --json id --jq '.[5:][].id' \
            | xargs -r -n1 gh cache delete || true
